 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1677ff"/><stop offset=".5" stop-color="#42c7ff"/><stop offset="1" stop-color="#8bdcff"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#aabbd0"/><stop offset="1" stop-color="#eaf5ff"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#087bff" stop-opacity=".38"/><stop offset="1" stop-color="#087bff" stop-opacity="0"/></radialGradient>
