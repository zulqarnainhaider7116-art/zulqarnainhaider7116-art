<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="520" viewBox="0 0 1440 520" role="img" aria-labelledby="t d">
<title id="t">ZXH OFFICIAL — Spectrum Edition</title><desc id="d">A vibrant animated multicolor identity banner for ZXH OFFICIAL.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#100923"/><stop offset=".48" stop-color="#101b39"/><stop offset="1" stop-color="#071b27"/></linearGradient>
 <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ff4d9d"><animate attributeName="stop-color" values="#ff4d9d;#a66bff;#35d7ff;#62efb3;#ffb84d;#ff4d9d" dur="12s" repeatCount="indefinite"/></stop><stop offset=".28" stop-color="#a66bff"/><stop offset=".55" stop-color="#35d7ff"/><stop offset=".78" stop-color="#62efb3"/><stop offset="1" stop-color="#ffb84d"/></linearGradient>
 <radialGradient id="pink"><stop stop-color="#ff3e9e" stop-opacity=".55"/><stop offset="1" stop-color="#ff3e9e" stop-opacity="0"/></radialGradient>
 <radialGradient id="cyan"><stop stop-color="#24d7ff" stop-opacity=".45"/><stop offset="1" stop-color="#24d7ff" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="42"/></filter><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#dcecff" opacity=".24"/></pattern>
</defs>
<rect width="1440" height="520" rx="34" fill="url(#bg)"/>
<rect width="1440" height="520" rx="34" fill="url(#dots)"/>
<circle cx="250" cy="130" r="300" fill="url(#pink)" filter="url(#blur)"><animate attributeName="cx" values="250;390;250" dur="10s" repeatCount="indefinite"/></circle>
<circle cx="1190" cy="390" r="330" fill="url(#cyan)" filter="url(#blur)"><animate attributeName="cy" values="390;260;390" dur="9s" repeatCount="indefinite"/></circle>
<path d="M-80 440C220 220 410 590 700 350S1180 110 1510 300" fill="none" stroke="url(#rainbow)" stroke-width="3" opacity=".6"><animate attributeName="stroke-dasharray" values="0 2200;1100 1100;2200 0" dur="9s" repeatCount="indefinite"/></path>
<rect x="35" y="35" width="1370" height="450" rx="28" fill="#080d1c" fill-opacity=".55" stroke="url(#rainbow)" stroke-width="2.5"/>
<rect x="48" y="48" width="1344" height="424" rx="21" fill="none" stroke="#ffffff" stroke-opacity=".12"/>
<g filter="url(#glow)">
 <text x="720" y="205" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" letter-spacing="13" fill="#dbeaff">THE DIGITAL CREATIVE UNIVERSE</text>
 <text x="720" y="310" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" letter-spacing="3" fill="url(#rainbow)">ZXH OFFICIAL</text>
 <text x="720" y="370" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" letter-spacing="8" fill="#f5f2ff">ZULQARNAIN X HAIDER</text>
</g>
<g fill="url(#rainbow)"><circle cx="170" cy="180" r="7"><animate attributeName="r" values="5;10;5" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="1260" cy="170" r="8"><animate attributeName="r" values="8;4;8" dur="2s" repeatCount="indefinite"/></circle><circle cx="240" cy="390" r="5"/><circle cx="1190" cy="390" r="6"/></g>
<text x="720" y="432" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="17" letter-spacing="5" fill="#b8c8e8">✦ DESIGN  •  DEVELOP  •  INNOVATE  •  REPEAT ✦</text>
</svg>