<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" role="img" aria-labelledby="title desc">
<title id="title">ZXH OFFICIAL — Motion Identity</title><desc id="desc">A premium graphite and electric-blue animated developer banner.</desc>
<defs>
